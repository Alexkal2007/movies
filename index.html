<!DOCTYPE html>
<html lang="en">
<head>
 <link rel="icon" type="image/png" href="favicon.png">
 <link rel="sitemap" type="application/xml" title="Sitemap" href="https://cinemaguide.online/sitemap.xml" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CINEMA GUIDE — Discover Movies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0B0B0D;
    --void-2:#151417;
    --gold:#D4AF37;
    --gold-dim:#8a7326;
    --wine:#7A2436;
    --wine-bright:#a52f45;
    --bone:#EDEAE1;
    --smoke:#8a8680;
    --line: rgba(237,234,225,0.12);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    background:var(--void); 
    color:var(--bone); 
    font-family:'Work Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
    scroll-behavior:smooth;
  }
  ::selection{background:var(--gold); color:var(--void);}
  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-track{background:var(--void);}
  ::-webkit-scrollbar-thumb{background:var(--wine); border-radius:4px;}

  h1,h2,h3,.display{font-family:'Bebas Neue', sans-serif; letter-spacing:0.04em; font-weight:400;}

  .filmstrip{
    height:16px;
    background-image: radial-gradient(circle at 10px 8px, var(--void) 5px, transparent 5.5px);
    background-size: 22px 16px;
    background-repeat: repeat-x;
    background-color: var(--gold-dim);
  }

  header{position:sticky; top:0; z-index:50; background:rgba(11,11,13,0.92); backdrop-filter: blur(8px); border-bottom:1px solid var(--line);}
  .nav-inner{max-width:1200px; margin:0 auto; padding:18px 28px; display:flex; align-items:center; justify-content:space-between; gap:20px;}
  .logo{font-family:'Bebas Neue', sans-serif; font-size:28px; letter-spacing:0.08em; color:var(--gold); display:flex; align-items:center; gap:8px;}
  .logo span{color:var(--bone);}
  
  .nav-controls {display:flex; align-items:center; gap:16px; flex:1; justify-content:flex-end;}
  .navsearch{flex:1; max-width:380px; position:relative;}
  .navsearch input{
    width:100%; background:var(--void-2); border:1px solid var(--line); color:var(--bone);
    padding:10px 14px 10px 38px; font-family:'Work Sans', sans-serif; font-size:14px; outline:none; transition:border-color .2s;
  }
  .navsearch input:focus{border-color:var(--gold);}
  .navsearch svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); opacity:0.5;}

  /* Language Switcher Button */
  .lang-btn {
    background: var(--void-2);
    border: 1px solid var(--gold);
    color: var(--gold);
    padding: 8px 14px;
    font-family: 'Work Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .lang-btn:hover {
    background: var(--gold);
    color: var(--void);
  }

  .hero{position:relative; overflow:hidden; border-bottom:1px solid var(--line);}
  .hero-inner{max-width:1200px; margin:0 auto; padding:64px 28px 48px; position:relative; z-index:2;}
  .eyebrow{font-size:12px; letter-spacing:0.25em; text-transform:uppercase; color:var(--gold); margin-bottom:14px; display:flex; align-items:center; gap:10px;}
  .eyebrow::before{content:''; width:24px; height:1px; background:var(--gold);}
  .marquee-title{font-size:clamp(52px,9vw,110px); line-height:0.92; color:var(--bone);}
  .marquee-title em{font-style:normal; color:transparent; -webkit-text-stroke:1.5px var(--wine-bright);}
  .hero-sub{max-width:520px; color:var(--smoke); font-size:16px; line-height:1.6; margin-top:18px;}

  .section{max-width:1200px; margin:0 auto; padding:44px 28px;}
  .section-head{display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:22px; border-bottom:1px solid var(--line); padding-bottom:14px;}
  .section-head h2{font-size:30px; color:var(--bone);}
  .section-head .num{font-size:13px; color:var(--smoke); letter-spacing:0.1em;}

  .genre-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:26px;}
  .chip{
    border:1px solid var(--line); background:transparent; color:var(--smoke); font-size:13px;
    padding:7px 14px; cursor:pointer; font-family:'Work Sans', sans-serif; transition:.15s;
  }
  .chip:hover{border-color:var(--gold); color:var(--bone);}
  .chip.active{background:var(--gold); border-color:var(--gold); color:var(--void); font-weight:600;}

  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(180px,1fr)); gap:22px;}

  .card{cursor:pointer; position:relative;}
  .poster-wrap{position:relative; aspect-ratio:2/3; overflow:hidden; background:var(--void-2); border:1px solid var(--line);}
  .poster-wrap img{width:100%; height:100%; object-fit:cover; display:block; transition:transform .35s ease, filter .35s ease;}
  .card:hover .poster-wrap img{transform:scale(1.06); filter:brightness(0.55);}
  .poster-fallback{display:flex; align-items:center; justify-content:center; height:100%; color:var(--smoke); font-family:'Bebas Neue'; font-size:22px; text-align:center; padding:10px;}
  .rating-badge{
    position:absolute; top:8px; right:8px; background:var(--void); border:1px solid var(--gold);
    color:var(--gold); font-size:12px; font-weight:700; padding:3px 7px; font-family:'Work Sans', sans-serif;
  }
  .card-hover-info{
    position:absolute; inset:0; display:flex; align-items:flex-end; padding:14px; opacity:0; transition:opacity .3s;
    background: linear-gradient(180deg, transparent 40%, rgba(11,11,13,0.95) 100%);
  }
  .card:hover .card-hover-info{opacity:1;}
  .card-hover-info span{font-size:12px; color:var(--gold); letter-spacing:0.05em;}
  .card-title{font-family:'Bebas Neue'; font-size:16px; margin-top:8px; letter-spacing:0.02em; line-height:1.15;}
  .card-year{font-size:12px; color:var(--smoke); margin-top:4px;}

  .loading, .empty{text-align:center; padding:60px 20px; color:var(--smoke); font-size:14px;}
  .spinner{width:26px; height:26px; border:2px solid var(--line); border-top-color:var(--gold); border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto 14px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* Modal Styling */
  .overlay{position:fixed; inset:0; background:rgba(11,11,13,0.85); backdrop-filter: blur(4px); z-index:100; display:flex; align-items:flex-start; justify-content:center; overflow-y:auto; padding:40px 20px;}
  .modal{background:var(--void-2); max-width:860px; width:100%; border:1px solid var(--line); position:relative; animation:rise .25s ease;}
  @keyframes rise{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);}}
  .modal-close{position:absolute; top:14px; right:14px; background:var(--void); border:1px solid var(--line); color:var(--bone); width:32px; height:32px; cursor:pointer; font-size:16px; z-index:5;}
  .modal-close:hover{border-color:var(--gold); color:var(--gold);}
  .modal-hero{display:grid; grid-template-columns:220px 1fr; gap:0;}
  .modal-hero img{width:100%; height:100%; object-fit:cover; display:block; border-right:1px solid var(--line);}
  .modal-info{padding:28px 30px;}
  .modal-info h2{font-size:36px; line-height:1;}
  .modal-meta{display:flex; gap:12px; flex-wrap:wrap; margin:14px 0; font-size:13px; color:var(--smoke); align-items:center;}
  .modal-meta b{color:var(--gold);}
  .runtime-badge{background:var(--void); border:1px solid var(--gold-dim); padding:3px 8px; border-radius:4px; color:var(--bone); font-weight:500;}
  .modal-overview{font-size:14px; line-height:1.7; color:var(--bone); opacity:0.9; margin-bottom: 20px;}

  /* Prime Video Affiliate Button Styling */
  .prime-affiliate-wrap {margin-bottom: 24px;}
  .prime-affiliate-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background-color: #00A8E1;
    color: #ffffff;
    font-family: 'Work Sans', sans-serif;
    font-size: 14px;
    font-weight: 700;
    padding: 12px 22px;
    border-radius: 6px;
    text-decoration: none;
    letter-spacing: 0.03em;
    transition: background-color 0.2s ease, transform 0.2s ease;
    box-shadow: 0 4px 12px rgba(0, 168, 225, 0.25);
  }
  .prime-affiliate-btn:hover {
    background-color: #0082b0;
    transform: translateY(-2px);
  }

  .modal-section{margin-top:28px; padding-top:20px; border-top:1px solid var(--line);}
  .modal-section-title{font-size:20px; color:var(--gold); margin-bottom:16px;}

  .cast-scroll-container {max-height: 320px; overflow-y: auto; padding: 8px 12px 12px 4px;}
  .cast-grid{display:grid; grid-template-columns: repeat(auto-fill, minmax(115px, 1fr)); gap: 18px 14px;}
  .cast-item{background: var(--void); border: 1px solid var(--line); padding: 12px 8px; text-align: center; display: flex; flex-direction: column; align-items: center; border-radius: 6px; overflow: hidden;}
  .cast-avatar-wrap {width: 72px; height: 72px; border-radius: 50%; overflow: hidden; margin-bottom: 10px; background: #1a191d; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; flex-shrink: 0;}
  .cast-avatar-wrap img {width: 100%; height: 100%; object-fit: cover; display: block;}
  .cast-avatar-wrap svg {width: 38px; height: 38px; fill: var(--smoke); opacity: 0.6;}
  .cast-name{font-size: 12px; font-weight: 600; color: var(--bone); line-height: 1.3; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
  .cast-character{font-size: 11px; color: var(--smoke); margin-top: 3px; line-height: 1.3; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}

  .trailer-container {position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; margin-top: 12px; border: 1px solid var(--line); background: #000;}
  .trailer-container iframe {position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;}

  footer{border-top:1px solid var(--line); padding:30px 28px; text-align:center; color:var(--smoke); font-size:12px;}

  @media (max-width:640px){
    .modal-hero{grid-template-columns:1fr;}
    .modal-hero img{max-height:280px; border-right:none; border-bottom:1px solid var(--line);}
    .nav-inner{flex-wrap:wrap;}
    .nav-controls{order:3; width:100%; justify-content:space-between;}
    .navsearch{max-width:100%; flex:1;}
  }
</style>
</head>
<body>

<header>
  <div class="nav-inner">
    <div class="logo">▮▮ <span>CINEMA GUIDE</span></div>
    <div class="nav-controls">
      <div class="navsearch">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="navSearchInput" type="text" placeholder="Search movie...">
      </div>
      <button id="langToggleBtn" class="lang-btn">🌐 <span>EL</span></button>
    </div>
  </div>
</header>

<div class="filmstrip"></div>

<section class="hero">
  <div class="hero-inner">
    <div class="eyebrow" id="heroEyebrow">MOVIE GUIDE</div>
    <h1 class="marquee-title" id="heroTitle">WHAT TO<br>WATCH <em>TONIGHT</em></h1>
    <p class="hero-sub" id="heroSub">Discover your next favorite film — check runtime, view ratings, watch trailers, and explore the cast.</p>
  </div>
</section>

<div class="filmstrip"></div>

<main id="mainContent">
  <section class="section">
    <div class="genre-row" id="genreRow"></div>

    <div class="section-head">
      <h2 id="gridTitle">Trending Now</h2>
      <span class="num" id="gridCount"></span>
    </div>
    <div id="movieGrid" class="grid"></div>
    <div id="loadingState" class="loading" style="display:none;"><div class="spinner"></div><span id="loadingTxt">Loading movies...</span></div>
    <div id="emptyState" class="empty" style="display:none;" id="emptyTxt">No movies found.</div>
  </section>
</main>

<footer id="footerTxt">REEL — movie discovery demo. Powered by TMDB.</footer>

<div id="modalRoot"></div>

<script>
(function(){
  const IMG = 'https://image.tmdb.org/t/p/w500';
  const API_KEY = '643419c13ccbd8f43fa2b9712e2dc455';
  
  let currentLang = 'en'; // 'en' or 'el'
  let genres = [];
  let searchTimeout = null;
  let activeGenre = null;

  const SVG_AVATAR = `<svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>`;

  // Translations Object
  const i18n = {
    en: {
      searchPlaceholder: "Search movie...",
      langBtnLabel: "EL",
      eyebrow: "MOVIE GUIDE",
      heroTitle: 'WHAT TO<br>WATCH <em>TONIGHT</em>',
      heroSub: "Welcome to CinemaGuide — Your Ultimate Movie & Streaming Directory. Tired of spending more time searching for a movie than actually watching it? CinemaGuide simplifies your decision-making process. Dive deep into plot overviews, runtime details, viewer ratings, and full cast member profiles. Preview HD trailers before you commit, compare available streaming services, and discover hidden cinematic gems tailored to your taste. Everything you need to plan your next movie night is just a click away.",
      trendingTitle: "Trending Now",
      searchResultFor: 'Results for',
      allGenres: "All",
      titlesCount: "titles",
      moreInfo: "View details →",
      loading: "Loading movies...",
      empty: "No movies found.",
      loadingRuntime: "Loading...",
      noRuntime: "N/A",
      noOverview: "No overview available.",
      watchPrimeBtn: "🍿 WATCH ON PRIME VIDEO",
      castTitle: "CAST",
      loadingCast: "Loading cast...",
      noCast: "No cast information available.",
      errCast: "Failed to load cast.",
      trailerTitle: "OFFICIAL TRAILER",
      loadingTrailer: "Loading trailer...",
      noTrailer: "No trailer available.",
      errTrailer: "Failed to load trailer.",
      footer: "CINEMA GUIDE — Explore Movies & TV Shows. Powered by TMDB.",
      hours: "h",
      mins: "m"
    },
    el: {
      searchPlaceholder: "Αναζήτηση ταινίας...",
      langBtnLabel: "EN",
      eyebrow: "ΟΔΗΓΟΣ ΤΑΙΝΙΩΝ",
      heroTitle: 'ΤΙ<br>ΠΑΙΖΕΙ <em>ΑΠΟΨΕ</em>',
      heroSub: "Καλώς ήρθες στο CinemaGuide — Ο Απόλυτος Οδηγός Ταινιών & Streaming. Κουράστηκες να ψάχνεις τι θα δεις περισσότερο από όσο διαρκεί η ίδια η ταινία; Το CinemaGuide κάνει την επιλογή παιχνιδάκι. Ανακάλυψε περιλήψεις υποθέσεων, λεπτομέρειες διάρκειας, βαθμολογίες κοινού και αναλυτικά προφίλ ηθοποιών. Δες HD trailers πριν αποφασίσεις, σύγκρινε τις διαθέσιμες πλατφόρμες streaming και ανακάλυψε διαμάντια του κινηματογράφου προσαρμοσμένα στα γούστα σου. Όλα όσα χρειάζεσαι για την επόμενη movie night είναι μόλις ένα κλικ μακριά.",
      trendingTitle: "ΔΗΜΟΦΙΛΗ ΤΩΡΑ",
      searchResultFor: 'Αποτελέσματα για',
      allGenres: "Όλα",
      titlesCount: "τίτλοι",
      moreInfo: "Δες περισσότερα →",
      loading: "Φορτώνει το πρόγραμμα...",
      empty: "Καμία ταινία δεν βρέθηκε.",
      loadingRuntime: "Φόρτωση...",
      noRuntime: "Μη διαθέσιμη",
      noOverview: "Δεν υπάρχει διαθέσιμη περίληψη.",
      watchPrimeBtn: "🍿 ΔΕΣ ΤΟ ΣΤΟ PRIME VIDEO",
      castTitle: "ΗΘΟΠΟΙΟΙ / CAST",
      loadingCast: "Φόρτωση ηθοποιών...",
      noCast: "Δεν βρέθηκαν πληροφορίες ηθοποιών.",
      errCast: "Αδυναμία φόρτωσης ηθοποιών.",
      trailerTitle: "ΕΠΙΣΗΜΟ TRAILER",
      loadingTrailer: "Φόρτωση Trailer...",
      noTrailer: "Δεν βρέθηκε διαθέσιμο trailer.",
      errTrailer: "Αδυναμία φόρτωσης trailer.",
      footer: "CINEMA GUIDE — Ανακάλυψε Ταινίες & Σειρές. Δεδομένα από TMDB.",
      hours: "ω",
      mins: "λ"
    }
  };

  const $ = (id) => document.getElementById(id);

  init();

  function init(){
    updateStaticTexts();
    loadGenresAndData();

    $('langToggleBtn').addEventListener('click', toggleLanguage);
  }

  function toggleLanguage() {
    currentLang = currentLang === 'en' ? 'el' : 'en';
    document.documentElement.lang = currentLang;
    updateStaticTexts();
    loadGenresAndData();
  }

  function getApiLangParam() {
    return currentLang === 'el' ? 'el-GR' : 'en-US';
  }

  function updateStaticTexts() {
    const t = i18n[currentLang];
    $('navSearchInput').placeholder = t.searchPlaceholder;
    $('langToggleBtn').querySelector('span').textContent = t.langBtnLabel;
    $('heroEyebrow').textContent = t.eyebrow;
    $('heroTitle').innerHTML = t.heroTitle;
    $('heroSub').textContent = t.heroSub;
    $('loadingTxt').textContent = t.loading;
    $('emptyState').textContent = t.empty;
    $('footerTxt').textContent = t.footer;
  }

  function loadGenresAndData() {
    $('loadingState').style.display = 'block';
    fetch(`https://api.themoviedb.org/3/genre/movie/list?api_key=${API_KEY}&language=${getApiLangParam()}`)
      .then(r => r.json())
      .then(data => {
        genres = data.genres || [];
        renderGenres();
        
        // Reload based on search input or active genre or trending
        const query = $('navSearchInput').value.trim();
        if (query) {
          performSearch(query);
        } else if (activeGenre) {
          fetchMoviesByGenre(activeGenre);
        } else {
          loadTrending();
        }
      })
      .catch(() => {
        $('loadingState').style.display = 'none';
      });
  }

  function renderGenres(){
    const row = $('genreRow');
    row.innerHTML = '';
    
    const allChip = document.createElement('button');
    allChip.className = `chip ${!activeGenre ? 'active' : ''}`;
    allChip.textContent = i18n[currentLang].allGenres;
    allChip.onclick = () => selectGenre(null, allChip);
    row.appendChild(allChip);

    genres.forEach(g => {
      const chip = document.createElement('button');
      chip.className = `chip ${activeGenre && activeGenre.id === g.id ? 'active' : ''}`;
      chip.textContent = g.name;
      chip.onclick = () => selectGenre(g, chip);
      row.appendChild(chip);
    });
  }

  function selectGenre(g, chipEl){
    activeGenre = g;
    $('navSearchInput').value = '';
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    chipEl.classList.add('active');

    if(g){
      fetchMoviesByGenre(g);
    } else {
      loadTrending();
    }
  }

  function fetchMoviesByGenre(g) {
    $('gridTitle').textContent = g.name;
    fetchMovies(`https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&language=${getApiLangParam()}&with_genres=${g.id}&sort_by=popularity.desc`);
  }

  function loadTrending(){
    activeGenre = null;
    $('gridTitle').textContent = i18n[currentLang].trendingTitle;
    fetchMovies(`https://api.themoviedb.org/3/trending/movie/week?api_key=${API_KEY}&language=${getApiLangParam()}`);
  }

  $('navSearchInput').addEventListener('input', (e) => {
    clearTimeout(searchTimeout);
    const q = e.target.value.trim();
    searchTimeout = setTimeout(() => {
      if(q.length === 0){ loadTrending(); return; }
      performSearch(q);
    }, 450);
  });

  function performSearch(q) {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    $('gridTitle').textContent = `${i18n[currentLang].searchResultFor} "${q}"`;
    fetchMovies(`https://api.themoviedb.org/3/search/movie?api_key=${API_KEY}&language=${getApiLangParam()}&query=${encodeURIComponent(q)}`);
  }

  function fetchMovies(url){
    $('movieGrid').innerHTML = '';
    $('emptyState').style.display = 'none';
    $('loadingState').style.display = 'block';
    fetch(url)
      .then(r => r.json())
      .then(data => {
        $('loadingState').style.display = 'none';
        const results = (data.results || []).filter(m => m.poster_path || m.title);
        $('gridCount').textContent = results.length ? `${results.length} ${i18n[currentLang].titlesCount}` : '';
        if(results.length === 0){ $('emptyState').style.display = 'block'; return; }
        renderGrid(results);
      })
      .catch(() => {
        $('loadingState').style.display = 'none';
        $('emptyState').style.display = 'block';
      });
  }

  function renderGrid(movies){
    const grid = $('movieGrid');
    grid.innerHTML = '';
    const t = i18n[currentLang];

    movies.forEach(m => {
      const card = document.createElement('div');
      card.className = 'card';
      const year = (m.release_date || '').slice(0,4) || '—';
      const rating = m.vote_average ? m.vote_average.toFixed(1) : '—';
      card.innerHTML = `
        <div class="poster-wrap">
          ${m.poster_path
            ? `<img loading="lazy" src="${IMG}${m.poster_path}" alt="${escapeHtml(m.title)}">`
            : `<div class="poster-fallback">${escapeHtml(m.title)}</div>`}
          <div class="rating-badge">★ ${rating}</div>
          <div class="card-hover-info"><span>${t.moreInfo}</span></div>
        </div>
        <div class="card-title">${escapeHtml(m.title)}</div>
        <div class="card-year">${year}</div>
      `;
      card.addEventListener('click', () => openModal(m));
      grid.appendChild(card);
    });
  }

  function escapeHtml(s){
    if(!s) return '—';
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function formatRuntime(minutes) {
    const t = i18n[currentLang];
    if(!minutes || minutes <= 0) return t.noRuntime;
    const hrs = Math.floor(minutes / 60);
    const mins = minutes % 60;
    if(hrs > 0) {
      return `${hrs}${t.hours} ${mins}${t.mins}`;
    }
    return `${mins}${t.mins}`;
  }

  function openModal(m){
    const root = $('modalRoot');
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.addEventListener('click', (e) => { if(e.target === overlay) overlay.remove(); });
    const year = (m.release_date || '').slice(0,4) || '—';
    const t = i18n[currentLang];

    overlay.innerHTML = `
      <div class="modal">
        <button class="modal-close" aria-label="Close">✕</button>
        <div class="modal-hero">
          <img src="${m.poster_path ? IMG + m.poster_path : ''}" alt="${escapeHtml(m.title)}" onerror="this.style.display='none'">
          <div class="modal-info">
            <h2>${escapeHtml(m.title)}</h2>
            <div class="modal-meta">
              <span><b>★ ${m.vote_average ? m.vote_average.toFixed(1) : '—'}</b></span>
              <span>•</span>
              <span>${year}</span>
              <span>•</span>
              <span id="runtimeSpan" class="runtime-badge">⏱ ${t.loadingRuntime}</span>
            </div>
            <p class="modal-overview">${escapeHtml(m.overview) || t.noOverview}</p>
            
            <div class="prime-affiliate-wrap">
              <a href="https://amzn.to/4q5HV4p" target="_blank" rel="noopener noreferrer" class="prime-affiliate-btn">
                ${t.watchPrimeBtn}
              </a>
            </div>

            <div class="modal-section">
              <h3 class="modal-section-title">${t.castTitle}</h3>
              <div class="cast-scroll-container">
                <div id="castArea" class="cast-grid">
                  <div style="color:var(--smoke); font-size:13px;">${t.loadingCast}</div>
                </div>
              </div>
            </div>

            <div class="modal-section">
              <h3 class="modal-section-title">${t.trailerTitle}</h3>
              <div id="trailerArea" class="trailer-container">
                <div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--smoke); font-size:13px;">${t.loadingTrailer}</div>
              </div>
            </div>

          </div>
        </div>
      </div>
    `;

    overlay.querySelector('.modal-close').addEventListener('click', () => overlay.remove());
    root.appendChild(overlay);

    // Fetch Details (Runtime)
    fetch(`https://api.themoviedb.org/3/movie/${m.id}?api_key=${API_KEY}&language=${getApiLangParam()}`)
      .then(r => r.json())
      .then(data => {
        const runtimeSpan = document.getElementById('runtimeSpan');
        if(runtimeSpan) {
          runtimeSpan.innerHTML = `⏱ ${formatRuntime(data.runtime)}`;
        }
      })
      .catch(() => {
        const runtimeSpan = document.getElementById('runtimeSpan');
        if(runtimeSpan) runtimeSpan.innerHTML = `⏱ —`;
      });

    // Fetch Cast 
    fetch(`https://api.themoviedb.org/3/movie/${m.id}/credits?api_key=${API_KEY}&language=${getApiLangParam()}`)
      .then(r => r.json())
      .then(data => {
        const castArea = document.getElementById('castArea');
        const cast = data.cast || [];

        if(cast.length > 0) {
          castArea.innerHTML = cast.map(actor => {
            const hasPhoto = !!actor.profile_path;
            const photoUrl = hasPhoto ? IMG + actor.profile_path : '';
            const name = escapeHtml(actor.name);
            const character = escapeHtml(actor.character);

            return `
              <div class="cast-item">
                <div class="cast-avatar-wrap">
                  ${hasPhoto 
                    ? `<img src="${photoUrl}" alt="${name}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                       <div style="display:none; width:100%; height:100%; align-items:center; justify-content:center;">${SVG_AVATAR}</div>` 
                    : SVG_AVATAR}
                </div>
                <div class="cast-name" title="${name}">${name}</div>
                <div class="cast-character" title="${character}">${character}</div>
              </div>
            `;
          }).join('');
        } else {
          castArea.innerHTML = `<div style="color:var(--smoke); font-size:13px;">${t.noCast}</div>`;
        }
      })
      .catch(() => {
        const castArea = document.getElementById('castArea');
        if(castArea) castArea.innerHTML = `<div style="color:var(--smoke); font-size:13px;">${t.errCast}</div>`;
      });

    // Fetch Trailer
    fetch(`https://api.themoviedb.org/3/movie/${m.id}/videos?api_key=${API_KEY}&language=${getApiLangParam()}`)
      .then(r => r.json())
      .then(data => {
        const trailerArea = document.getElementById('trailerArea');
        let videos = data.results || [];
        let trailer = videos.find(v => v.site === 'YouTube' && v.type === 'Trailer');

        // Fallback to English trailer if missing in Greek
        if (!trailer && currentLang === 'el') {
          fetch(`https://api.themoviedb.org/3/movie/${m.id}/videos?api_key=${API_KEY}&language=en-US`)
            .then(r => r.json())
            .then(enData => {
              const enVideos = enData.results || [];
              const enTrailer = enVideos.find(v => v.site === 'YouTube' && v.type === 'Trailer') || enVideos[0];
              renderTrailer(enTrailer);
            });
        } else {
          renderTrailer(trailer || videos[0]);
        }

        function renderTrailer(videoObj) {
          if(videoObj && videoObj.key) {
            trailerArea.innerHTML = `
              <iframe 
                src="https://www.youtube-nocookie.com/embed/${videoObj.key}" 
                title="Official Trailer" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
              </iframe>`;
          } else {
            trailerArea.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--smoke); font-size:13px;">${t.noTrailer}</div>`;
          }
        }
      })
      .catch(() => {
        const trailerArea = document.getElementById('trailerArea');
        if(trailerArea) {
          trailerArea.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--smoke); font-size:13px;">${t.errTrailer}</div>`;
        }
      });
  }

  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape'){
      const ov = document.querySelector('.overlay');
      if(ov) ov.remove();
    }
  });
})();
</script>

</body>
</html>
